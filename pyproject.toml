[project]
name = "deepsecure"
version = "0.1.0"
description = "Multimodal AI system for real-time deepfake scam detection (visual + audio + lip-sync) with a cybersecurity decision layer."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "jinja2>=3.1.6",
    "joblib>=1.6.0",
    "librosa>=0.11.0",
    "matplotlib>=3.11.2",
    "mediapipe>=1.1.0",
    "numpy<2",
    "opencv-contrib-python>=4.11.0.86",
    "pandas>=3.0.6",
    "pillow>=12.3.0",
    "pyarrow>=25.0.1",
    "pydantic>=2",
    "pydantic-settings>=2.16.0",
    "pydub>=0.25.1",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "soundfile>=0.14.0",
    "sqlalchemy>=2.0",
    "streamlit>=1.65.0",
    "timm>=1.0.30",
    "torch>=2.14.1",
    "torchaudio>=2.11.0",
    "torchvision>=0.29.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
    "watchdog>=6.0.0",
]

# Building the project as a package means `uv sync` installs `deepsecure` into
# the venv (editable), so `import deepsecure` works from scripts/ and tests/.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deepsecure"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["slow: tests that take more than a few seconds (deselect with -m 'not slow')"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", "models", "reports", "logs", "docs", "deepsecure/models/third_party"]  # docs: hand-aligned teaching snippets

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
